name: farmer_mobile
description: AgriSage — Farmer Mobile App. Order supplies, diagnose rice diseases with AI, and track debt with agents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI & UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  dotted_border: ^2.1.0
  smooth_page_indicator: ^1.2.0+3  # Onboarding dots

  # Utils
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3

  # Fonts (Google Fonts — bám sát Inter + Be Vietnam Pro của web)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
