name: farmer_mobile
description: AgriSage — Farmer Mobile App. Order supplies, diagnose rice diseases with AI, and track debt with agents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:  # hộp chọn ngày, hộp thoại hệ thống bằng tiếng Việt
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_riverpod: ^2.5.1

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  flutter_secure_storage: ^9.2.2

  # UI & UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  smooth_page_indicator: ^1.2.0+3  # Onboarding dots

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # Fonts (Google Fonts — bám sát Inter + Be Vietnam Pro của web)
  google_fonts: ^6.2.1
  lottie: ^3.6.1
  webview_flutter: ^4.10.0  # trang thanh toán payOS
  shared_preferences: ^2.3.3  # thanh toán payOS đang dở
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  signalr_netcore: 1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
